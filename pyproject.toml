[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "litekit"
dynamic = ["version"]
description = "An unofficial, opinionated toolkit for LiteLLM (BerriAI) with vision and evaluation support."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Chaman Singh Verma" },
]
requires-python = ">=3.8"
dependencies = [
    "litellm==1.89.3",
    "streamlit==1.58.0",
    "pytest==9.1.1",
    "python-dotenv==1.2.2",
    "Pillow==12.2.0",
    "pydantic==2.13.4",
    "opencv-python==4.13.0.92",
    "numpy==2.5.0",
    "lmdb==2.2.1",
    "google-genai==2.10.0",
    "requests==2.34.2",
    "tqdm==4.68.3",
    "typing-extensions==4.15.0",
    "rich==15.0.0",
    "dspy-ai==3.2.1",
    "agno==2.6.19",
    "langchain==1.3.10",
    "langchain-google-genai==4.2.5",
    "langchain-openai==1.3.2",
    "langchain-ollama==1.1.0",
    "langgraph==1.2.6",
]

[project.urls]
Homepage = "https://github.com/csv610/LiteKit"
Repository = "https://github.com/csv610/LiteKit"

[project.scripts]
cli-litetext = "app.cli.liteclient_cli:main_cli"

[project.optional-dependencies]
dev = [
    "pytest-cov==7.1.0",
    "pylint==4.0.5",
    "black==26.5.1",
    "ruff==0.15.19",
]

[tool.setuptools.packages.find]
include = ["litekit", "litekit.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.setuptools.dynamic]
version = {attr = "litekit.__version__"}

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.pylint]
py-version = "3.8"
